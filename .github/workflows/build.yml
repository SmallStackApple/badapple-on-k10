name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: firmware (esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    env:
      IDF_CCACHE_ENABLE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Build
        working-directory: firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Size report
        working-directory: firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: badapple-firmware
          if-no-files-found: error
          path: |
            firmware/build/badapple.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args

  tools:
    name: tools (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Byte-compile helper scripts
        run: python -m compileall -q tools

      - name: Check build_media.py --help
        run: python tools/build_media.py --help
